packages:
  - "apps/*"
  - "packages/*"

# Windows workaround: pnpm 11's pre-run deps check re-runs `pnpm install`,
# which falls through prebuild-install for better-sqlite3 and tries to
# node-gyp rebuild — that fails on Windows boxes without Visual Studio
# Build Tools. The initial `pnpm install` from root works fine (uses the
# cached win32 prebuild), so we opt out of the redundant re-verify.
verifyDepsBeforeRun: false

# Post-install build scripts pnpm needs explicit permission to run.
# Required for local dev/build:
#   - esbuild        — bundler used by wrangler + vitest
#   - unrs-resolver  — native resolver used by eslint-import-resolver-typescript
#   - workerd        — Cloudflare's local runtime, required by wrangler dev
#
# `better-sqlite3` is intentionally NOT allowed to run its build script:
# it's used only by `drizzle-kit studio`, and on Windows the fallback
# node-gyp rebuild fails without Visual Studio Build Tools. Devs who need
# `drizzle-kit studio` locally can add `better-sqlite3: true` and ensure
# VS Build Tools are installed.
allowBuilds:
  better-sqlite3: false
  esbuild: true
  unrs-resolver: true
  workerd: true
